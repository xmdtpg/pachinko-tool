<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>パチンコ回転率計算</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f4f7ff;padding:20px 14px 45px}.wrap{max-width:520px;margin:auto}h1{font-size:24px;margin:10px 0 5px}.sub{color:#9ba9c2;font-size:13px;margin:0 0 22px}.panel{background:#172238;border:1px solid #293a55;border-radius:18px;padding:18px;margin:14px 0}label{display:block;color:#bfcce0;font-size:14px;margin-bottom:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select{width:100%;font-size:20px;color:white;background:#0d1729;border:1px solid #40516b;border-radius:11px;padding:13px 11px;outline:none}input:focus,select:focus{border-color:#74a9ff}input::placeholder{color:#61728b}.field{margin-bottom:16px}.result{text-align:center;padding:20px 0 10px}.big{font-size:55px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums}.unit{color:#b9c7da;font-size:14px}.status{font-size:17px;font-weight:700;margin:12px 0}.good{color:#65e5a0}.bad{color:#ff8181}.neutral{color:#d1ddf0}.details{display:flex;justify-content:space-between;border-top:1px solid #31405a;padding:13px 0;font-size:14px}.details strong{font-variant-numeric:tabular-nums}button{border:0;border-radius:12px;padding:13px 15px;font-size:15px;font-weight:700;cursor:pointer}button.primary{background:#548cf9;color:white;flex:1}button.secondary{background:#2b3950;color:#f4f7ff}button.danger{background:transparent;color:#f19a9a;font-size:13px}button:active{opacity:.8}.actions{display:flex;gap:10px}.history{display:flex;flex-direction:column;gap:9px}.entry{background:#101a2b;border:1px solid #30405b;border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.entry small{display:block;color:#a9b9d0;margin-top:5px}.entry strong{font-size:19px}.muted{color:#9ba9c2;font-size:13px}.foot{font-size:12px;color:#8190a8;line-height:1.7}</style></head><body><main class="wrap"><h1>🎯 パチンコ回転率計算</h1><p class="sub">玉数と回転数を入力するだけで自動計算</p><section class="panel"><div class="field"><label for="rate">貸玉レート</label><select id="rate"><option value="4">4パチ（1,000円 = 250玉）</option><option value="1">1パチ（1,000円 = 1,000玉）</option></select></div><div class="grid"><div class="field"><label for="balls">使用玉数（発）</label><input id="balls" type="number" inputmode="numeric" min="0" placeholder="1800"></div><div class="field"><label for="spins">回転数（回）</label><input id="spins" type="number" inputmode="numeric" min="0" placeholder="144"></div></div><div class="field"><label for="border">ボーダー（250玉あたり・任意）</label><input id="border" type="number" inputmode="decimal" min="0" step="0.1" placeholder="例：18.5"></div><div class="actions"><button class="primary" id="save">この結果を履歴に保存</button><button class="secondary" id="clear">入力クリア</button></div></section><section class="panel"><div class="result"><div class="muted">250玉あたりの回転率</div><div class="big" id="result">—</div><div class="unit">回 / 250玉</div><div class="status neutral" id="status">玉数と回転数を入力してください</div></div><div class="details"><span>1,000円あたり（選択レート）</span><strong id="peryen">—</strong></div><div class="details"><span>ボーダーとの差（250玉）</span><strong id="difference">—</strong></div><div class="details"><span>使用金額換算</span><strong id="spent">—</strong></div></section><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><strong>保存履歴</strong><button class="danger" id="deleteAll">全件削除</button></div><div id="history" class="history"><div class="muted">履歴はありません</div></div></section><p class="foot">※現金貸玉の単純換算です。実際の貸玉数・再プレー手数料・持ち玉遊技などにより金額換算は異なります。履歴はこのブラウザのローカルストレージに保存されます。</p></main><script>(()=>{const $=id=>document.getElementById(id);const ids=['rate','balls','spins','border'];const key='pachinko_rotation_history_v1';let history=[];try{history=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(history))history=[]}catch{}function calc(){const b=Number($('balls').value),s=Number($('spins').value),r=Number($('rate').value),border=Number($('border').value),hasBorder=$('border').value!=='';if($('balls').value===''||$('spins').value===''||b<=0||s<0){$('result').textContent='—';$('peryen').textContent='—';$('difference').textContent='—';$('spent').textContent='—';$('status').textContent='玉数と回転数を入力してください';$('status').className='status neutral';return null}const v=s/b*250;const diff=hasBorder?v-border:null;$('result').textContent=v.toFixed(2);$('peryen').textContent=(v*(1000/r)/250).toFixed(2)+' 回';$('spent').textContent=Math.round(b*r).toLocaleString('ja-JP')+' 円';$('difference').textContent=diff===null?'—':(diff>=0?'+':'')+diff.toFixed(2)+' 回';$('status').textContent=diff===null?'ボーダーを入力すると比較できます':diff>=0?'ボーダー以上':'ボーダー未満';$('status').className='status '+(diff===null?'neutral':diff>=0?'good':'bad');return{b,s,r,border:hasBorder?border:null,v}}function render(){const el=$('history');el.replaceChildren();if(!history.length){const e=document.createElement('div');e.className='muted';e.textContent='履歴はありません';el.append(e);return}history.forEach((h,i)=>{const e=document.createElement('div');e.className='entry';const left=document.createElement('div');const title=document.createElement('strong');title.textContent=h.v.toFixed(2)+' 回 / 250玉';const small=document.createElement('small');small.textContent=`${h.date} ｜ ${h.r}パチ ｜ ${h.b}玉・${h.s}回転${h.border!==null?' ｜ ボーダー '+h.border:''}`;left.append(title,small);const del=document.createElement('button');del.className='danger';del.textContent='削除';del.addEventListener('click',()=>{history.splice(i,1);persist()});e.append(left,del);el.append(e)})}function persist(){try{localStorage.setItem(key,JSON.stringify(history))}catch{alert('履歴を保存できませんでした')}render()}ids.forEach(id=>$(id).addEventListener('input',calc));$('save').addEventListener('click',()=>{const x=calc();if(!x){alert('使用玉数と回転数を正しく入力してください');return}history.unshift({...x,date:new Date().toLocaleString('ja-JP')});history=history.slice(0,100);persist()});$('clear').addEventListener('click',()=>{['balls','spins','border'].forEach(id=>$(id).value='');calc()});$('deleteAll').addEventListener('click',()=>{if(history.length&&confirm('保存した履歴をすべて削除しますか？')){history=[];persist()}});calc();render()})();</script></body></html>
